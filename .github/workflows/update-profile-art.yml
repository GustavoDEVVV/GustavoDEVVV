name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC todo dia
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências (só as leves)
        run: pip install requests beautifulsoup4

      - name: Buscar contribuições públicas
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Renderizar heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commitar se algo mudou
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza gráfico de contribuições [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
