name: Update profile art


on:

  schedule:

    - cron: "17 6 * * *"


  workflow_dispatch: {}


  push:

    branches: [main]


permissions:

  contents: write


jobs:

  profile:

    runs-on: ubuntu-latest


    steps:

      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================
      # PYTHON
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================
      # DEPENDÊNCIAS
      # ==========================

      - name: Instalar dependências

        run: |

          pip install requests


      # ==========================
      # LINGUAGENS DO GITHUB
      # ==========================

      - name: Buscar linguagens dos repositórios

        env:

          GITHUB_USERNAME: ${{ github.repository_owner }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          python scripts/fetch_languages.py


      # ==========================
      # PROFILE ENGINE
      # ==========================

      - name: Gerar Profile Engine

        run: |

          python scripts/build.py


      # ==========================
      # COMMIT
      # ==========================

      - name: Commitar mudanças

        uses: stefanzweifel/git-auto-commit-action@v5

        with:

          commit_message: "chore: atualiza profile art [skip ci]"

          file_pattern: |

            data/languages.json

            generated/*.svg

            contrib-heatmap.svg