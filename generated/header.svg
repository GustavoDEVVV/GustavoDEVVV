<?xml version="1.0" encoding="UTF-8"?>

<svg

xmlns="http://www.w3.org/2000/svg"

xmlns:xlink="http://www.w3.org/1999/xlink"

width="1000"

height="320"

viewBox="0 0 1000 320"

role="img"

>

<defs>

<linearGradient
id="bgGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%"
>

<stop
offset="0%"
stop-color="#0d1117"
/>

<stop
offset="100%"
stop-color="#090d12"
/>

</linearGradient>

</defs>


<rect

width="100%"

height="100%"

fill="url(#bgGradient)"

rx="18"

/>



<pattern
id="grid"
width="40"
height="40"
