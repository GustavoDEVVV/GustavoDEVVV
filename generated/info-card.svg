</linearGradient>


<filter id="glow">

<feGaussianBlur
stdDeviation="5"
result="coloredBlur"/>

<feMerge>

<feMergeNode
in="coloredBlur"/>

<feMergeNode
in="SourceGraphic"/>

</feMerge>

</filter>


</defs>


<rect

